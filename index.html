<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmacêutico Sales Júnior</title>
    <meta name="description" content="Sistema de gestão de medicamentos para farmácia hospitalar, focado no controle estrito de psicotrópicos e entorpecentes." />
    <meta property="og:title" content="Farmacêutico Sales Júnior" />
    <meta property="og:description" content="Sistema de gestão de medicamentos para farmácia hospitalar, focado no controle estrito de psicotrópicos e entorpecentes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>

    <!-- Ponto de entrada padrão do Vite (usado no preview do AI Studio e no build) -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fallback automático apenas para GitHub Pages se servido estaticamente da raiz -->
    <script>
      (function() {
        if (window.location.hostname.endsWith('github.io') && !document.querySelector('script[src*="assets/index.js"]')) {
          var s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = './assets/index.js';
          document.body.appendChild(s);

          var c = document.createElement('link');
          c.rel = 'stylesheet';
          c.crossOrigin = 'anonymous';
          c.href = './assets/index.css';
          document.head.appendChild(c);
        }
      })();
    </script>
  </body>
</html>
